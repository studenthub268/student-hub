# CI — runs the same gate as `npm run preflight` on every push and PR:
# ESLint → tsc → production build → `next start` → the 3-phase smoke suite
# (HTTP/SSR + headless-Chrome UI + Clerk auth E2E) against the live database.
#
# Required repo secrets (Settings → Secrets and variables → Actions):
#   DATABASE_URL            — Neon pooled connection string (the smoke suite
#                             reads the real DB and the auth phase creates/
#                             deletes one Clerk test user)
#   NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY — activates the Clerk provider
#   CLERK_SECRET_KEY        — Backend API: creates the test user + sign-in token
#   CLERK_WEBHOOK_SECRET    — signs the webhook lifecycle requests AND the
#                             server's CLERK_WEBHOOK_SECRET for this run
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Lint + typecheck + smoke
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      # One secret, two roles: the app's webhook endpoint verifies against it
      # and the smoke's auth phase signs user.created with it (exactly what
      # Clerk's configured endpoint does in production).
      CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure Chrome is available (playwright-core drives system Chrome)
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          else
            wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo gpg --dearmor -o /usr/share/keyrings/google.gpg
            echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google.gpg] https://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update
            sudo apt-get install -y google-chrome-stable
            google-chrome --version
          fi

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      - name: Start the app (production build)
        run: |
          npm run start &
          npx --yes wait-on http://127.0.0.1:3000 --timeout 120000
          curl -s -o /dev/null -w "app up: HTTP %{http_code}\n" http://127.0.0.1:3000/

      - name: Smoke suite (3 phases, against the live DB)
        run: node scripts/smoke-browse.mjs

      # Dedicated lifecycle gate: signed svix user.created (existing-email
      # attach) → user.updated → user.deleted against the same server.
      - name: Clerk webhook lifecycle check
        run: node scripts/clerk-webhook-check.mjs http://127.0.0.1:3000

      # RLS: apply the repo's policy set (idempotent) to the live DB, then
      # prove the enforcement guarantees still hold (scoped role cannot forge
      # identity, touch other users' rows, or write unidentified).
      - name: RLS policy sync + enforcement check
        run: |
          node scripts/setup-rls.mjs
          node scripts/rls-enforcement-check.mjs

      # Same production server, one step: the four layout/security gates.
      # The layout audits mock the client session/admin APIs themselves, and
      # the probe's assertions are environment-agnostic (HTTP headers are set
      # by next.config regardless of scheme), so they run against 127.0.0.1.
      - name: Layout + security audits
        run: |
          node scripts/nav-mobile-check.mjs http://127.0.0.1:3000
          node scripts/ipad-signedin-check.mjs http://127.0.0.1:3000
          node scripts/signedin-audit.mjs http://127.0.0.1:3000
          node scripts/blackbox-probe.mjs http://127.0.0.1:3000
